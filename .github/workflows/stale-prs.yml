name: Stale PR Cleanup

on:
  schedule:
    # Daily at 6am CT (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:

# actions/stale lists PRs through the issues API and saves its run state as
# an Actions cache, so it needs issues and actions too (README "Recommended
# permissions"). Without issues it fails: "Resource not accessible by
# integration". contents is not needed: delete-branch is off.
permissions:
  actions: write
  issues: write
  pull-requests: write

jobs:
  stale:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # PRs only — skip issues entirely
          days-before-issue-stale: -1
          days-before-issue-close: -1

          # Warn at 24h, close at 48h
          days-before-pr-stale: 1
          days-before-pr-close: 1

          stale-pr-label: stale
          stale-pr-message: >
            This PR is 24h old. Please merge or close to avoid merge conflicts.
          close-pr-message: >
            Auto-closed: PR exceeded 48h without merge. Re-open and rebase if still needed.

          # Exemptions
          # actions/stale has no author filter (exempt-pr-authors was an
          # unknown input, ignored); Dependabot labels its PRs "dependencies".
          exempt-pr-labels: 'do-not-close,wip,dependencies'
          exempt-all-pr-assignees: false
          # Drafts are work in progress, not stale.
          exempt-draft-pr: true

          # CI minutes budget: process max 10 PRs per run
          operations-per-run: 10
